id = "RooseveltAdvisors.herdr-extractor"
name = "herdr-extractor"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "extrakto-inspired scrollback token extraction for Herdr; credits laktak/extrakto"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "extract"
title = "Extract scrollback tokens"
description = "List URLs, paths, quotes, and words from pane scrollback and copy one"
command = ["./scripts/open-extractor"]

[[panes]]
id = "extract"
title = "herdr-extractor"
placement = "overlay"
command = ["./target/release/herdr-extractor"]
